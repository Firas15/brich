<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120b1f">
<title>brich</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#120b1f; --card:#1d1430; --card2:#291c44; --line:#35265c;
  --text:#f4f0fd; --muted:#a395c6; --pri:#8b5cf6; --pri2:#b69cff;
  --paid:#22c55e; --warn:#f5a524; --danger:#f43f5e;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1c1131,#150d25)}
#top .ttl{flex:1;font-weight:700;font-size:17px;text-align:center;padding:6px}
#top .nav,#top .ico{width:38px;height:38px;border-radius:12px;background:var(--card2);font-size:20px;
  display:grid;place-items:center;color:var(--pri2)}
#top .ico svg{width:20px;height:20px}
#view{flex:1;overflow-y:auto;padding:12px 12px 110px}
#tabs{display:flex;border-top:1px solid var(--line);background:#150d25;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;
  color:var(--muted);font-size:12px;font-weight:600;border-radius:12px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--pri2);background:rgba(139,92,246,.12)}
.brand{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#c4b5fd,#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .l{color:var(--muted);font-size:12px;font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.stat.p .v{color:var(--paid)} .stat.w .v{color:var(--warn)}
.hero{background:linear-gradient(135deg,#7c3aed,#4c1d95);border-radius:20px;padding:16px;margin-bottom:14px}
.hero .l{opacity:.8;font-size:13px;font-weight:600}
.hero .v{font-size:30px;font-weight:800;margin-top:2px}
.hero .s{opacity:.8;font-size:13px;margin-top:4px}

.day{font-weight:700;color:var(--muted);font-size:13px;text-transform:lowercase;margin:16px 4px 6px}
.day:first-child{margin-top:0}
.day.today{color:var(--pri2)}
.day.today::after{content:" · сегодня"}
.empty-day{color:var(--muted);font-size:13px;padding:10px 14px;background:var(--card);border-radius:14px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px 12px;margin-bottom:8px}
.lesson .tm{font-weight:700;font-size:14px;text-align:right;min-width:44px;line-height:1.5}
.lesson .tm span{display:block;color:var(--muted);font-weight:600}
.lesson .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--pri)}
.lesson.paid .bar{background:var(--paid)}
.lesson .nm{flex:1;min-width:0}
.lesson .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .nm span{color:var(--muted);font-size:13px}
.lesson.cancel{opacity:.45}
.lesson.cancel .nm b{text-decoration:line-through}
.pay{padding:8px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;
  border:1.5px solid var(--warn);color:var(--warn)}
.pay.on{background:var(--paid);border-color:var(--paid);color:#06210f}
.pay.sub{border-color:var(--pri2);color:var(--pri2)}
.pay.sub.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lesson.subpaid .bar{background:var(--pri)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd label{position:relative}
.wd input{position:absolute;opacity:0}
.wd span{display:block;text-align:center;padding:10px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.wd input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:11px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.seg input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.note{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.35);border-radius:12px;padding:10px 12px;font-size:13px;color:#d9ccff;margin-bottom:12px}
.tag{font-size:12px;color:var(--muted);font-weight:600}

.sec{font-weight:700;color:var(--muted);font-size:13px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--pri2);font-weight:700;font-size:13px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.row .am{font-weight:800}
.row.auto{border-color:rgba(139,92,246,.5)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 20px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:700}
th{color:var(--muted);font-weight:700;font-size:12px;background:var(--card2)}
th:first-child{background:var(--card2)}
td.tot{font-weight:800;color:var(--pri2)}
tr.cur td{background:rgba(139,92,246,.1)}
tr.cur td:first-child{background:#2a1f46}
tfoot td{font-weight:800;border-bottom:0;background:var(--card2)}
tfoot td:first-child{background:var(--card2)}
td.z{color:#5b4d80}
tbody tr{cursor:pointer}

.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;
  background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 8px 24px rgba(124,58,237,.45);display:grid;place-items:center}

#sheet-wrap{position:fixed;inset:0;z-index:10}
#sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(5,2,12,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:#1a1129;
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:0 0 5px 2px}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;min-height:44px}
.inp:focus{border-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--pri)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-weight:700;text-align:center;margin-top:8px;background:var(--card2);color:var(--text)}
.btn.pri{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.btn.danger{color:var(--danger)}
.btn.ok{color:var(--paid)}
.edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.edit-row .inp{flex:1}
.edit-row .inp.sm{flex:0 0 96px}
.x{width:44px;height:44px;border-radius:12px;background:var(--card2);color:var(--danger);font-size:18px;flex:none}
.loader{display:grid;place-items:center;height:60vh;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2d1f4d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"><div class="loader">Загрузка…</div></main>
  <nav id="tabs">
    <button data-tab="sch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Расписание</button>
    <button data-tab="inc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v6M18 9.5v6"/></svg>Доходы</button>
    <button data-tab="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Год</button>
  </nav>
</div>
<div id="sheet-wrap" hidden><div class="backdrop" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const ver = v => IN_TG && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
const CLOUD = ver('6.9') && !!tg.CloudStorage;
if (IN_TG) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#150d25'); tg.setBackgroundColor('#120b1f'); } catch (e) {}
  try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = () => { try { if (ver('6.1')) tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const ask = msg => new Promise(r => { if (ver('6.2')) tg.showConfirm(msg, ok => r(!!ok)); else r(confirm(msg)); });

/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const wday = s => (parse(s).getDay() + 6) % 7;
const mkey = s => s.slice(0, 7);
const today = () => ymd(new Date());
const money = n => Math.round(n || 0).toLocaleString('ru-RU') + ' ₽';
const num = v => { const n = Number(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const addMin = (t, m) => { const [h, mi] = t.split(':').map(Number); const x = h * 60 + mi + m; return `${pad(Math.floor(x / 60) % 24)}:${pad(x % 60)}`; };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fShort = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
const fDay = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const fDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' });
const COLORS = ['#a78bfa','#f472b6','#38bdf8','#fbbf24','#34d399','#fb7185','#c084fc','#60a5fa'];
const ICON_USERS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

/* ================= Storage =================
   meta  -> ученики (st), повторяющиеся занятия (sl), категории доходов (cat)
   m_YYYY_MM -> отметки занятий (mk), разовые занятия (on), доходы (inc)
   Значения длиннее 4000 символов режутся на куски (лимит CloudStorage — 4096). */
let meta = { st: [], sl: [], cat: [] };
let months = {};
const M = k => months[k] || (months[k] = { mk: {}, on: [], inc: [], ab: {} });
const LS = 'brich_';
const CHUNK = 4000;
const cs = CLOUD ? tg.CloudStorage : null;
const call = (fn, ...a) => new Promise((res, rej) => fn.call(cs, ...a, (err, v) => err ? rej(err) : res(v)));

const backend = CLOUD ? {
  async all() {
    const keys = await call(cs.getKeys);
    const out = {};
    for (let i = 0; i < keys.length; i += 20) Object.assign(out, await call(cs.getItems, keys.slice(i, i + 20)));
    return out;
  },
  set: (k, v) => call(cs.setItem, k, v),
} : {
  async all() {
    const out = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(LS)) out[k.slice(LS.length)] = localStorage.getItem(k); } } catch (e) {}
    return out;
  },
  async set(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} },
};

async function writeKey(key, str) {
  if (str.length <= CHUNK) return backend.set(key, str);
  const n = Math.ceil(str.length / CHUNK);
  for (let i = 0; i < n; i++) await backend.set(`${key}__${i}`, str.slice(i * CHUNK, (i + 1) * CHUNK));
  await backend.set(key, '@' + n);
}
function readKey(all, key) {
  const v = all[key];
  if (v == null || v === '') return null;
  if (v[0] === '@') { let s = ''; for (let i = 0, n = +v.slice(1); i < n; i++) s += all[`${key}__${i}`] || ''; return s; }
  return v;
}
const dirty = new Set();
let saving = Promise.resolve();
function save(key) { dirty.add(key); clearTimeout(save.h); save.h = setTimeout(flush, 300); }
function flush() {
  const keys = [...dirty]; dirty.clear();
  saving = saving.then(async () => {
    for (const k of keys) {
      const str = k === 'meta' ? JSON.stringify(meta) : JSON.stringify(months[k]);
      const sk = k === 'meta' ? 'meta' : 'm_' + k.replace('-', '_');
      try { await writeKey(sk, str); } catch (e) { toast('Не удалось сохранить, проверь интернет'); dirty.add(k); }
    }
  });
}
const saveMeta = () => save('meta');
const saveMonth = k => save(k);

async function load() {
  let all = {};
  try { all = await backend.all(); } catch (e) { toast('Не удалось загрузить данные'); }
  const m = readKey(all, 'meta');
  if (m) { try { meta = Object.assign({ st: [], sl: [], cat: [] }, JSON.parse(m)); } catch (e) {} }
  else {
    meta.cat = [{ id: uid(), n: 'Онлайн-школа' }, { id: uid(), n: 'Стипендия' }];
    saveMeta();
  }
  for (const k of Object.keys(all)) {
    const mt = /^m_(\d{4})_(\d{2})$/.exec(k);
    if (!mt) continue;
    try { months[`${mt[1]}-${mt[2]}`] = Object.assign({ mk: {}, on: [], inc: [], ab: {} }, JSON.parse(readKey(all, k))); } catch (e) {}
  }
}

/* ================= Data logic ================= */
const student = id => meta.st.find(s => s.id === id);
const cat = id => meta.cat.find(c => c.id === id);
const catColor = id => COLORS[(meta.cat.findIndex(c => c.id === id) + 1) % COLORS.length];

function lessonsOn(date) {
  const res = [], mm = months[mkey(date)], wd = wday(date);
  for (const s of meta.sl)
    if (s.w === wd && s.f <= date && (!s.u || date < s.u))
      res.push({ id: s.id + '_' + date.replace(/-/g, ''), slot: s, sid: s.s, t: s.t, l: s.l, base: s.$, date });
  if (mm) for (const o of mm.on) if (o.d === date)
    res.push({ id: o.id, one: o, sid: o.s, t: o.t, l: o.l, base: o.$, date });
  const ab = (mm && mm.ab) || {};
  for (const L of res) {
    const k = (mm && mm.mk[L.id]) || {};
    L.cancel = !!k.c; L.price = k.$ != null ? k.$ : L.base;
    L.st = student(L.sid) || { n: 'Ученик удалён' };
    L.name = sName(L.st);
    L.subPaid = ab[L.sid] != null;       // абонемент за этот месяц оплачен
    L.sub = L.subPaid || !!L.st.sub;     // ученик занимается по абонементу
    L.paid = L.subPaid || (!L.sub && !!k.p);
  }
  return res.sort((a, b) => a.t.localeCompare(b.t));
}
const sName = s => s.g ? `${s.n} ${s.g}кл` : s.n;
const WD_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function setMark(L, patch) {
  const key = mkey(L.date), mm = M(key);
  const m = Object.assign({}, mm.mk[L.id], patch);
  for (const k of Object.keys(m)) if (m[k] == null || m[k] === 0 && k !== '$') delete m[k];
  if (Object.keys(m).length) mm.mk[L.id] = m; else delete mm.mk[L.id];
  saveMonth(key);
}
function daysOfMonth(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function tutorMonth(key) {
  let paid = 0, wait = 0;
  const waitSub = new Set();
  for (let d = 1, n = daysOfMonth(key); d <= n; d++)
    for (const L of lessonsOn(`${key}-${pad(d)}`)) {
      if (L.cancel || L.subPaid) continue;
      if (L.sub) { waitSub.add(L.sid); continue; }
      if (L.paid) paid += L.price; else wait += L.price;
    }
  const ab = (months[key] && months[key].ab) || {};
  const subs = Object.values(ab).reduce((a, b) => a + b, 0);
  for (const sid of waitSub) wait += (student(sid) || {}).ab || 0;
  return { paid: paid + subs, wait, subs };
}
function lessonsOfStudentInMonth(sid, key) {
  let n = 0;
  for (let d = 1, k = daysOfMonth(key); d <= k; d++)
    n += lessonsOn(`${key}-${pad(d)}`).filter(L => L.sid === sid && !L.cancel).length;
  return n;
}
function catSums(key) {
  const out = {}, mm = months[key];
  if (mm) for (const i of mm.inc) out[i.c] = (out[i.c] || 0) + i.a;
  return out;
}

/* ================= UI state ================= */
const now = new Date();
const ui = { tab: 'sch', week: mondayOf(now), month: `${now.getFullYear()}-${pad(now.getMonth() + 1)}`, year: now.getFullYear(), L: {} };
const shiftMonth = (k, d) => { const [y, m] = k.split('-').map(Number); const x = new Date(y, m - 1 + d, 1); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; };
const monthTitle = k => { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  ({ sch: renderSchedule, inc: renderIncome, year: renderYear })[ui.tab]();
}

/* ---------- Расписание ---------- */
function renderSchedule() {
  const ws = ui.week, we = addDays(ws, 6), td = today();
  $('#top').innerHTML = `
    <button class="nav" data-act="wk" data-d="-1">‹</button>
    <button class="ttl" data-act="wk0">${fShort.format(ws)} – ${fShort.format(we)}</button>
    <button class="nav" data-act="wk" data-d="1">›</button>
    <button class="ico" data-act="students" aria-label="Ученики">${ICON_USERS}</button>`;
  let paid = 0, wait = 0, html = '', any = false;
  ui.L = {};
  for (let i = 0; i < 7; i++) {
    const d = ymd(addDays(ws, i)), ls = lessonsOn(d);
    if (!ls.length && d !== td) continue;
    html += `<div class="day ${d === td ? 'today' : ''}">${fDay.format(parse(d))}</div>`;
    if (!ls.length) html += `<div class="empty-day">Занятий нет</div>`;
    for (const L of ls) {
      any = true; ui.L[L.id] = L;
      if (!L.cancel && !L.sub) { if (L.paid) paid += L.price; else wait += L.price; }
      const btn = L.cancel ? '<span class="tag">отменено</span>'
        : L.sub ? `<button class="pay sub ${L.subPaid ? 'on' : ''}" data-act="sub" data-id="${L.id}">${L.subPaid ? '✓ Абонемент' : 'Абонемент'}</button>`
        : `<button class="pay ${L.paid ? 'on' : ''}" data-act="pay" data-id="${L.id}">${L.paid ? '✓ Оплачено' : 'Не оплачено'}</button>`;
      html += `
      <div class="lesson ${L.subPaid ? 'subpaid' : L.paid ? 'paid' : ''} ${L.cancel ? 'cancel' : ''}" data-act="lesson" data-id="${L.id}">
        <div class="tm">${L.t}<span>${addMin(L.t, L.l)}</span></div>
        <div class="bar"></div>
        <div class="nm"><b>${esc(L.name)}</b><span>${L.sub ? 'по абонементу' : money(L.price)}${L.one ? ' · разовое' : ''}</span></div>
        ${btn}
      </div>`;
    }
  }
  $('#view').innerHTML = `
    <div class="stats">
      <div class="stat p"><div class="l">Оплачено за неделю</div><div class="v">${money(paid)}</div></div>
      <div class="stat w"><div class="l">Ждёт оплаты</div><div class="v">${money(wait)}</div></div>
    </div>
    ${html}
    ${any ? '' : `<div class="empty">На этой неделе занятий нет.<br>Нажми <b>+</b>, чтобы добавить.</div>`}
    <button class="fab" data-act="addLesson" aria-label="Добавить занятие">+</button>`;
}

function renderYear() {
  const y = ui.year;
  $('#top').innerHTML = `
    <button class="nav" data-act="yr" data-d="-1">‹</button>
    <div class="ttl"><span class="brand">brich</span> · ${y}</div>
    <button class="nav" data-act="yr" data-d="1">›</button>`;
  const rows = [];
  const used = new Set();
  for (let m = 1; m <= 12; m++) {
    const k = `${y}-${pad(m)}`, cs = catSums(k);
    Object.keys(cs).forEach(id => used.add(id));
    rows.push({ k, m, tu: tutorMonth(k).paid, cs });
  }
  const cols = meta.cat.filter(c => !c.x || used.has(c.id));
  const colTot = cols.map(c => rows.reduce((a, r) => a + (r.cs[c.id] || 0), 0));
  const tuTot = rows.reduce((a, r) => a + r.tu, 0);
  const grand = tuTot + colTot.reduce((a, b) => a + b, 0);
  const cell = v => v ? `<td>${Math.round(v).toLocaleString('ru-RU')}</td>` : '<td class="z">—</td>';
  const cur = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  const filled = rows.filter(r => r.tu || Object.keys(r.cs).length).length;
  $('#view').innerHTML = `
    <div class="hero"><div class="l">Доход за ${y} год</div><div class="v">${money(grand)}</div>
      ${filled ? `<div class="s">В среднем ${money(grand / filled)} в месяц</div>` : ''}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Месяц</th><th>Репетит.</th>${cols.map(c => `<th>${esc(c.n)}</th>`).join('')}<th>Итого</th></tr></thead>
      <tbody>${rows.map(r => {
        const t = r.tu + cols.reduce((a, c) => a + (r.cs[c.id] || 0), 0);
        return `<tr class="${r.k === cur ? 'cur' : ''}" data-act="goMonth" data-k="${r.k}"><td>${MON_SHORT[r.m - 1]}</td>${cell(r.tu)}${cols.map(c => cell(r.cs[c.id])).join('')}${t ? `<td class="tot">${Math.round(t).toLocaleString('ru-RU')}</td>` : '<td class="z">—</td>'}</tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td>Всего</td><td>${Math.round(tuTot).toLocaleString('ru-RU')}</td>${colTot.map(v => `<td>${Math.round(v).toLocaleString('ru-RU')}</td>`).join('')}<td class="tot">${Math.round(grand).toLocaleString('ru-RU')}</td></tr></tfoot>
    </table></div>
    <div class="sub" style="text-align:center;margin-top:10px;color:var(--muted);font-size:12px">Суммы в рублях · нажми на месяц, чтобы открыть его</div>`;
}

/* ================= Events ================= */
document.addEventListener('click', async e => {
  const tab = e.target.closest('#tabs button');
  if (tab) { ui.tab = tab.dataset.tab; render(); $('#view').scrollTop = 0; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = +el.dataset.d;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'wk': ui.week = addDays(ui.week, 7 * d); render(); break;
    case 'wk0': ui.week = mondayOf(new Date()); render(); break;
    case 'mo': ui.month = shiftMonth(ui.month, d); render(); break;
    case 'yr': ui.year += d; render(); break;
    case 'goMonth': ui.month = el.dataset.k; ui.tab = 'inc'; render(); break;
    case 'pay': { e.stopPropagation(); const L = ui.L[el.dataset.id]; setMark(L, { p: L.paid ? 0 : 1 }); haptic(); render(); break; }
    case 'lesson': sheetLesson(ui.L[el.dataset.id]); break;
    case 'addLesson': sheetAddLesson(); break;
    case 'lPay': { const L = ui.cur; setMark(L, { p: L.paid ? 0 : 1 }); haptic(); closeSheet(); render(); break; }
    case 'lCancel': { const L = ui.cur; setMark(L, { c: L.cancel ? 0 : 1 }); closeSheet(); render(); break; }
    case 'lEnd': {
      const L = ui.cur;
      if (!await ask(`Убрать «${L.st.n}» из расписания начиная с этого дня? Прошлые занятия и оплаты останутся.`)) break;
      L.slot.u = L.date;
      if (L.slot.u <= L.slot.f) meta.sl = meta.sl.filter(s => s !== L.slot);
      saveMeta(); closeSheet(); render(); break;
    }
    case 'lDel': {
      const L = ui.cur; if (!await ask('Удалить это занятие?')) break;
      const k = mkey(L.date), mm = M(k); mm.on = mm.on.filter(o => o.id !== L.id); delete mm.mk[L.id];
      saveMonth(k); closeSheet(); render(); break;
    }
    case 'students': sheetStudents(); break;
    case 'sub': { e.stopPropagation(); const L = ui.L[el.dataset.id]; sheetSub(L.sid, mkey(L.date)); break; }
    case 'lSub': { const L = ui.cur; sheetSub(L.sid, mkey(L.date)); break; }
    case 'subUndo': {
      const { sid, key } = ui.curSub;
      if (!await ask('Отменить оплату абонемента за этот месяц?')) break;
      delete M(key).ab[sid]; saveMonth(key); closeSheet(); render(); break;
    }
    case 'lUnsub': {
      const L = ui.cur;
      if (!await ask(`Перевести «${L.name}» на оплату за каждое занятие? Уже оплаченные абонементы останутся. Цену занятий потом нужно будет указать.`)) break;
      L.st.sub = 0; saveMeta(); closeSheet(); render(); break;
    }
    case 'lPriceAll': {
      const L = ui.cur, p = num($('#f').p.value); if (!p) return toast('Введи сумму');
      splitSlotPrice(L, p); closeSheet(); render(); toast('Цена изменена для этого и следующих'); break;
    }
    case 'stDel': {
      const s = student(el.dataset.id);
      if (!await ask(`Удалить ученика «${sName(s)}»? Будущие занятия пропадут из расписания, прошлые оплаты останутся.`)) break;
      s.x = 1; const td = today();
      meta.sl = meta.sl.filter(sl => { if (sl.s !== s.id) return true; if (sl.f >= td) return false; if (!sl.u || sl.u > td) sl.u = td; return true; });
      saveMeta(); $('#stList').innerHTML = sheetStudents.rows(); render(); break;
    }
    case 'addInc': sheetIncome(null); break;
    case 'inc': { const it = (months[ui.month].inc || []).find(i => i.id === el.dataset.id); if (it) sheetIncome(it); break; }
    case 'incDel': { if (!await ask('Удалить эту запись?')) break; removeIncome(ui.curInc); closeSheet(); render(); break; }
    case 'cats': sheetCats(); break;
    case 'catAdd': { const n = $('#catN').value.trim(); if (!n) return toast('Введи название'); meta.cat.push({ id: uid(), n }); saveMeta(); $('#catList').innerHTML = sheetCats.rows(); $('#catN').value = ''; render(); break; }
    case 'catDel': {
      const c = cat(el.dataset.id);
      if (!await ask(`Удалить категорию «${c.n}»? Уже внесённые суммы останутся в отчётах.`)) break;
      c.x = 1; saveMeta(); $('#catList').innerHTML = sheetCats.rows(); render(); break;
    }
  }
});

(async () => { await load(); render(); })();
</script>
</body>
